name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: interface
      - run: npm test && npm run format:check && npm run build
        working-directory: interface
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: interface
      - run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/release --parallel 4
      - run: ctest --test-dir build/release --output-on-failure --parallel 2
