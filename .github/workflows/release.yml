name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: interface
      - run: npm test && npm run build
        working-directory: interface
      - run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/release --parallel 4
      - run: ctest --test-dir build/release --output-on-failure --parallel 2
      - name: Package, sign, notarize and staple
        if: vars.ENABLE_HOSTED_SIGNING == 'true'
        run: python3 scripts/release_ci.py
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && vars.ENABLE_HOSTED_SIGNING == 'true'
        with:
          name: LoopZ-macOS-release
          path: artifacts/release-0.2.3/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_HOSTED_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --tag "$GITHUB_REF_NAME"
      - name: Local signing mode
        if: vars.ENABLE_HOSTED_SIGNING != 'true'
        run: echo 'Validation completed. Sign, notarize and publish locally; hosted signing is disabled.'
